<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Neo Green Gradient -->
    <linearGradient id="neoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E599;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00AF92;stop-opacity:1" />
    </linearGradient>

    <!-- Fairy Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Sparkle Filter -->
    <filter id="sparkle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e" stroke="url(#neoGradient)" stroke-width="4"/>

  <!-- Hexagon Frame (Neo style) -->
  <polygon
    points="256,56 406,131 406,281 256,356 106,281 106,131"
    fill="none"
    stroke="url(#neoGradient)"
    stroke-width="3"
    opacity="0.6"
    transform="translate(0, 50)"
  />

  <!-- Fairy Wing Left -->
  <path
    d="M180,200 Q120,160 140,240 Q100,220 130,280 Q90,280 140,320 Q160,360 200,300 Q180,260 180,200"
    fill="url(#neoGradient)"
    opacity="0.7"
    filter="url(#glow)"
  />

  <!-- Fairy Wing Right -->
  <path
    d="M332,200 Q392,160 372,240 Q412,220 382,280 Q422,280 372,320 Q352,360 312,300 Q332,260 332,200"
    fill="url(#neoGradient)"
    opacity="0.7"
    filter="url(#glow)"
  />

  <!-- Fairy Body (Wand/Magic element) -->
  <ellipse cx="256" cy="280" rx="35" ry="50" fill="url(#neoGradient)" filter="url(#glow)"/>

  <!-- Fairy Head -->
  <circle cx="256" cy="210" r="30" fill="url(#neoGradient)" filter="url(#glow)"/>

  <!-- Magic Wand -->
  <line x1="256" y1="330" x2="256" y2="420" stroke="url(#neoGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Wand Star -->
  <polygon
    points="256,420 262,435 280,435 266,446 272,464 256,454 240,464 246,446 232,435 250,435"
    fill="#00E599"
    filter="url(#sparkle)"
  />

  <!-- Sparkles around fairy -->
  <g fill="#00E599" filter="url(#sparkle)">
    <!-- Top sparkle -->
    <polygon points="256,140 259,150 269,150 261,156 264,166 256,160 248,166 251,156 243,150 253,150" transform="scale(0.8) translate(64, 30)"/>

    <!-- Left sparkle -->
    <polygon points="100,250 103,260 113,260 105,266 108,276 100,270 92,276 95,266 87,260 97,260" transform="scale(0.6) translate(50, 50)"/>

    <!-- Right sparkle -->
    <polygon points="400,250 403,260 413,260 405,266 408,276 400,270 392,276 395,266 387,260 397,260" transform="scale(0.6) translate(80, 50)"/>

    <!-- Bottom left sparkle -->
    <circle cx="150" cy="380" r="4"/>
    <circle cx="362" cy="380" r="4"/>
    <circle cx="180" cy="150" r="3"/>
    <circle cx="332" cy="150" r="3"/>
  </g>

  <!-- Code brackets < > representing development -->
  <text x="80" y="270" font-family="monospace" font-size="48" font-weight="bold" fill="url(#neoGradient)" opacity="0.5">&lt;</text>
  <text x="392" y="270" font-family="monospace" font-size="48" font-weight="bold" fill="url(#neoGradient)" opacity="0.5">&gt;</text>
</svg>
